<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · PanelVault</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #faf6ee; color: #16161a;
        font-family: system-ui, sans-serif; background-image: radial-gradient(rgb(22 22 26 / 0.09) 1px, transparent 1px); background-size: 16px 16px; }
      main { max-width: 420px; margin: 16px; padding: 32px; background: #fff; border: 3px solid #16161a; border-radius: 10px;
        box-shadow: 6px 6px 0 #16161a; text-align: center; }
      h1 { font-size: 1.6rem; text-transform: uppercase; margin: 0 0 12px; }
      p { color: #5a524a; line-height: 1.5; }
      a { display: inline-block; margin-top: 12px; padding: 10px 18px; border: 2px solid #16161a; border-radius: 10px;
        background: #c7321f; color: #fff; font-weight: 700; text-transform: uppercase; text-decoration: none; box-shadow: 4px 4px 0 #16161a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Esta página aún no está guardada en tu dispositivo. Tu biblioteca y el lector sí funcionan sin internet si ya los abriste antes.</p>
      <a href="/biblioteca">Ir a mi biblioteca</a>
    </main>
  </body>
</html>
